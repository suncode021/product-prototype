ht:36px;place-items:center;border-radius:var(--radius)}.metric-ok{background:#caefd6;color:oklch(.38 .1 155)}.metric-warn{background:oklch(.93 .06 72);color:oklch(.43 .1 72)}.metric-info{background:oklch(.92 .045 252);color:#17497b}.metric-down{background:oklch(.93 .05 28);color:#822c25}.metric-card span{color:var(--muted);font-size:.82rem}.metric-card strong{display:block;margin-top:5px;font-size:1.45rem;line-height:1.1}.metric-card em{grid-column:2;color:var(--subtle);font-size:.8rem;font-style:normal}.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;margin-top:14px}.live-section,.alerts-panel,.device-section{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}.live-section,.device-section{padding:18px}.alerts-panel{padding:16px}.section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.section-heading p{margin-top:5px;color:var(--muted);font-size:.86rem;line-height:1.45}.section-heading.compact{align-items:center}.primary-button{border:1px solid var(--accent-strong);background:var(--accent);color:#fff;font-weight:700;padding:0 14px}.primary-button:hover{background:var(--accent-strong)}.secondary-button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;white-space:nowrap}.text-button{min-height:32px;border:0;background:transparent;color:var(--accent-strong);font-weight:700;padding:0 4px}.text-button:hover{color:var(--accent)}.camera-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.camera-card{min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:#f8fcfc;overflow:hidden}.video-thumb{position:relative;min-height:164px;overflow:hidden;background:linear-gradient(135deg,#1e3d46,#081d28),#192c35}.camera-card.warn .video-thumb{background:linear-gradient(135deg,#4b311d,#062128),#192c35}.camera-card.down .video-thumb{background:linear-gradient(135deg,#212d33,#0a1319),#152127}.video-thumb:before{position:absolute;inset:12px;border:1px solid oklch(1 0 0 / .18);border-radius:6px;content:""}.video-thumb:after{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 22%,oklch(1 0 0 / .08) 22% 23%,transparent 23% 100%),linear-gradient(0deg,transparent 0 48%,oklch(1 0 0 / .06) 48% 49%,transparent 49% 100%);content:""}.video-line{position:absolute;display:block;border-radius:999px;background:#ffffff29}.line-a{top:58px;left:32px;width:54%;height:8px}.line-b{right:28px;bottom:42px;width:42%;height:8px}.camera-number{position:absolute;right:16px;bottom:12px;color:#ffffffad;font-size:1.15rem;font-weight:800}.recording-dot{position:absolute;top:18px;left:18px;width:9px;height:9px;border-radius:999px;background:var(--danger)}.camera-card.down .recording-dot{background:#69777e}.camera-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 12px 4px}.camera-meta strong{display:block;font-size:.92rem}.camera-meta span{display:inline-flex;align-items:center;gap:4px;margin-top:5px;color:var(--muted);font-size:.8rem}.camera-card p{padding:0 12px 12px;color:var(--subtle);font-size:.8rem}.status-badge{display:inline-flex;min-height:24px;align-items:center;justify-content:center;border-radius:999px;font-size:.76rem;font-weight:700;padding:0 9px;white-space:nowrap}.status-ok{background:#caefd6;color:oklch(.35 .1 155)}.status-warn{background:oklch(.93 .06 72);color:oklch(.4 .1 72)}.status-down{background:oklch(.93 .05 28);color:#862721}.status-idle{background:#e4e0fe;color:#4f417e}.alert-list{display:grid;gap:10px;margin-top:16px}.alert-item{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid var(--line);border-radius:var(--radius);padding:11px}.alert-level{display:grid;width:28px;height:28px;place-items:center;border-radius:999px;font-size:.78rem;font-weight:800}.level-高{background:oklch(.93 .05 28);color:#862721}.level-中{background:oklch(.93 .06 72);color:oklch(.4 .1 72)}.level-低{background:#caefd6;color:oklch(.35 .1 155)}.alert-item strong{display:block;font-size:.88rem;line-height:1.35}.alert-item span:not(.alert-level){display:inline-flex;align-items:center;gap:4px;margin-top:7px;color:var(--muted);font-size:.78rem}.device-section{margin-top:14px}.table-actions{display:flex;align-items:center;gap:9px}.device-table{margin-top:16px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius)}.table-row{display:grid;grid-template-columns:1.05fr 1.35fr 1fr 1.05fr .78fr .82fr 44px;min-height:52px;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:0 12px}.table-row:last-child{border-bottom:0}.table-head{min-height:42px;background:var(--surface-2);color:var(--muted);font-size:.78rem;font-weight:700}.table-row:not(.table-head){color:var(--muted);font-size:.85rem}.table-row:not(.table-head):hover{background:#f4fcfb}.table-row strong{color:var(--ink);font-size:.84rem}.row-action{width:32px;min-height:32px;border:1px solid transparent;background:transparent;color:var(--muted)}@media (prefers-reduced-motion: reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}@media (max-width: 1180px){.camera-admin-shell{display:block}.sidebar{position:static;width:auto;height:auto;flex-direction:row;align-items:center;padding:14px 18px}.nav-list{display:flex;flex:1;overflow-x:auto}.nav-item{white-space:nowrap}.sidebar-panel{display:none}.metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid{grid-template-columns:1fr}}@media (max-width: 760px){.workspace{padding:16px}.topbar,.section-heading{align-items:stretch;flex-direction:column}.topbar-actions,.search-field{width:100%}.metrics-grid,.camera-grid{grid-template-columns:1fr}.table-actions{align-items:stretch;flex-direction:column}.primary-button,.secondary-button{width:100%}.device-table{display:grid;gap:10px;border:0;overflow:visible}.table-head{display:none}.ta <body>

  <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>

</body>
